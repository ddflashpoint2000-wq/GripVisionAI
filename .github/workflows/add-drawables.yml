name: Add Drawable Backgrounds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-drawables:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate placeholder dark court PNGs
        run: |
          python3 - << 'EOF'
          import os, struct, zlib

          out_dir = "app/src/main/res/drawable"
          os.makedirs(out_dir, exist_ok=True)

          def write_png(path, width, height, rgb):
              r, g, b = rgb
              raw = bytearray()
              row = bytes([r, g, b]) * width
              for _ in range(height):
                  raw.append(0)
                  raw.extend(row)

              def chunk(tag, data):
                  crc = zlib.crc32(tag + data) & 0xffffffff
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", crc)

              ihdr = struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0)
              idat = zlib.compress(bytes(raw), level=6)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)

          files = {
              "bg_futuristic_stadium.png": (7, 15, 19),
              "bg_court_tennis.png": (8, 22, 28),
              "bg_court_padel.png": (6, 26, 24),
              "bg_court_pickleball.png": (10, 20, 30),
          }
          for name, color in files.items():
              write_png(os.path.join(out_dir, name), 720, 1280, color)
          EOF

      - name: Commit drawable files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable/*.png
          if ! git diff --staged --quiet; then
            git commit -m "Add drawable background images"
            git push
          fi
