name: Build GripVision APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare Hand Model and Manifest
        run: python3 -c "import os, urllib.request, base64; os.makedirs('app/src/main/assets', exist_ok=True); urllib.request.urlretrieve(base64.b64decode('aHR0cHM6Ly9zdG9yYWdlLmdvb2dsZWFwaXMuY29tL21lZGlhcGlwZS1tb2RlbHMvaGFuZF9sYW5kbWFya2VyL2hhbmRfbGFuZG1hcmtlci9mbG9hdDE2LzEvaGFuZF9sYW5kbWFya2VyLnRhc2s=').decode(), 'app/src/main/assets/hand_landmarker.task'); open('app/src/main/AndroidManifest.xml', 'wb').write(base64.b64decode(''))"
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GripVisionAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
